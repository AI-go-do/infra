# 서버(학교 실습 서버)와 노트북에서 M-SPACE 전체(입구·core·DB·AI 비서)를 띄우는 compose.
# 같은 파일을 개발/시연에 같이 쓰고, 값은 .env 파일로만 바꾼다.
#   개발: docker compose -p mspace-dev  --env-file .env.dev  up -d
#   시연: docker compose -p mspace-prod --env-file .env.prod up -d
# (-p 프로젝트 이름이 다르면 컨테이너·DB 볼륨이 따로 생겨서 서로 안 섞인다)

services:
  # 입구 문(edge): 서버 포트를 잡고 있는 작은 nginx. 무중단 배포용 (edge/default.conf, README "무중단 배포")
  # 뒤의 gateway·core·web을 바꾸는 동안에도 이 문은 계속 열려 있고, 요청을 살아 있는 컨테이너로 보낸다
  # 학교 nginx → edge(8000) → gateway. 안쪽에서 core·web을 부를 때도 edge(8080·8081)를 지나 꺼지는 컨테이너를 피한다
  edge:
    image: nginx:1.28-alpine            # upstream "resolve"(이름을 계속 다시 찾기)가 1.27.3부터 무료판에 들어옴
    ports:
      # 개발 8413, 시연 8414 (재웅 포트 범위. 8410·8411은 글결 블로그, 8412는 블로그 Nginx 설정이 가리킴)
      # 기본은 127.0.0.1(이 컴퓨터 안에서만). 맥 로컬은 이대로 쓴다.
      # 학교 서버는 Nginx 관리자가 http://10.116.64.12:<포트>(서버의 학교 내부 주소)로 부르므로 .env에 BIND_ADDR=10.116.64.12.
      # 0.0.0.0은 쓰지 않는다 (Docker가 연 포트는 서버 방화벽 ufw를 건너뛰어 모든 주소로 열린다)
      # 맥에서 같은 와이파이의 폰·키패드 노트북으로 시험할 때만 .env에 BIND_ADDR=0.0.0.0
      # 8000만 연다. 안쪽용 8080·8081·8099는 열지 않는다
      - "${BIND_ADDR:-127.0.0.1}:${PORT}:8000"
    volumes:
      # 파일 하나가 아니라 폴더째 연결: git pull로 파일이 바뀌어도 컨테이너가 새 파일을 보고, nginx -s reload만으로 반영된다
      - ./edge:/etc/nginx/conf.d:ro
    environment:
      TZ: Asia/Seoul
    stop_grace_period: 30s
    restart: unless-stopped

  # API 게이트웨이(Spring Cloud Gateway, mspace-gateway 레포 이미지). 밖에서는 edge를 통해서만 들어온다
  # 로그인 토큰(JWT)을 여기서 먼저 확인하고, /api/agent/** → agent, /api/** → core, 나머지 → 화면(web)으로 보낸다
  # 포트를 열지 않아서 scripts/rollout.sh가 두 개를 잠깐 같이 띄울 수 있다(무중단 교체)
  gateway:
    image: ghcr.io/ai-go-do/mspace-gateway:${GATEWAY_TAG:?.env에 GATEWAY_TAG를 넣어 주세요 (개발 develop, 시연 main)}
    environment:
      # core와 같은 값이어야 core가 준 토큰을 확인할 수 있다 (같은 .env의 JWT_SECRET을 그대로 넘긴다)
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 넣어 주세요 (openssl rand -base64 48)}
      # core·web은 edge를 지나서 부른다: 교체 중 꺼지는 컨테이너를 edge가 피해 준다
      CORE_URI: http://edge:8080
      AGENT_URI: http://agent:8091
      WEB_URI: http://edge:8081
      # 방 공기 판단(climate). /api/climate/** 길과, core가 받아 준 센서 값 사본을 보낼 안쪽 주소
      CLIMATE_URI: http://climate:8095
      CLIMATE_MIRROR_URL: http://climate:8095/internal/sensor-events
      TZ: Asia/Seoul
    depends_on:
      edge:
        condition: service_started
      core:
        condition: service_started
      web:
        condition: service_started
    stop_grace_period: 40s              # 끌 때 하던 요청을 마칠 시간 (Spring Boot graceful 30초 + 여유)
    restart: unless-stopped

  # 방 공기 이상 탐지·냉난방 자동 제어 (mspace-climate 레포, 재웅 11/12). 포트를 열지 않고 gateway 뒤에서만
  # 센서 값은 gateway가 사본으로 주고, 재실·관리자 확인은 core에 묻는다. 7일 기준선 기록은 climate-data 볼륨에 남는다
  climate:
    image: ghcr.io/ai-go-do/mspace-climate:${CLIMATE_TAG:-develop}
    environment:
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 넣어 주세요 (openssl rand -base64 48)}
      CORE_URI: http://edge:8080
      CLIMATE_DATA_DIR: /data
      # 교육장 센서·보드 A 추론 결과 직접 구독(재웅 11/12 결정). 비면 구독하지 않고 gateway 사본만 쓴다
      CLIMATE_MQTT_USERNAME: ${CLIMATE_MQTT_USERNAME:-}
      CLIMATE_MQTT_PASSWORD: ${CLIMATE_MQTT_PASSWORD:-}
      # 켤 기기를 고르는 오디 AI(제미나이). 비우면 규칙만. CLIMATE_GEMINI_API_KEY를 따로 넣으면 그 키, 없으면 비서와 같은 GEMINI_API_KEY
      GEMINI_API_KEY: ${CLIMATE_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      TZ: Asia/Seoul
    volumes:
      - climate-data:/data
    stop_grace_period: 20s              # 끌 때 기록 파일을 남길 시간
    restart: unless-stopped

  # 화면(PWA): 빌드한 정적 파일을 내는 컨테이너 (mspace-web 레포 이미지). 밖으로 열지 않고 gateway를 통해서만
  web:
    image: ghcr.io/ai-go-do/mspace-web:${WEB_TAG:?.env에 WEB_TAG를 넣어 주세요 (개발 develop, 시연 main)}
    stop_grace_period: 30s
    restart: unless-stopped

  # 예약 코어 (GitHub Actions가 GHCR에 올린 이미지)
  core:
    image: ghcr.io/ai-go-do/mspace-core:${CORE_TAG:-develop}
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME:?.env에 DB_NAME을 넣어 주세요}
      DB_USERNAME: ${DB_USERNAME:?.env에 DB_USERNAME을 넣어 주세요}
      DB_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 넣어 주세요 (openssl rand -hex 24)}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      # 키패드(게이트웨이)가 Authorization: Bearer 로 보내는 장치 토큰. 비면 core가 장치 요청을 전부 401로 막으니 비어 있으면 아예 안 켠다
      MSPACE_DEVICE_TOKEN: ${MSPACE_DEVICE_TOKEN:?.env에 MSPACE_DEVICE_TOKEN을 넣어 주세요 (openssl rand -hex 32)}
      # 장치별 토큰(core #91): "deviceId:roomId:토큰"을 쉼표로 (예: keypad-1:1:aaa,qr-1:1:bbb). 그 방에만 쓸 수 있다.
      # 비워 두면 위 공용 토큰만 쓴다. 공용 토큰과 같은 값을 넣으면 core가 뜨지 않는다. 토큰에 : 와 , 는 못 쓴다
      MSPACE_DEVICES: ${MSPACE_DEVICES:-}
      # 로그인 토큰 서명값. 필수: 비어 있으면 compose가 시작을 멈춘다. 값을 바꾸면 모두 다시 로그인해야 한다
      JWT_SECRET: ${JWT_SECRET:?.env에 JWT_SECRET을 넣어 주세요 (openssl rand -base64 48)}
      # refresh 토큰 쿠키를 HTTPS로만 보낸다. http 주소로만 열 때(맥 Safari 시험)만 false
      MSPACE_AUTH_COOKIE_SECURE: ${MSPACE_AUTH_COOKIE_SECURE:-true}
      # 인증번호 메일. false면 번호가 core 로그에만 찍혀서 학생이 로그인할 수 없다
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      # 경고 철회 요청 Gemini 판단기(core #117). 비우면 규칙 판단기만. CORE_GEMINI_API_KEY를 따로 넣으면 그 키, 없으면 비서와 같은 GEMINI_API_KEY
      GEMINI_API_KEY: ${CORE_GEMINI_API_KEY:-${GEMINI_API_KEY:-}}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy         # DB가 준비된 뒤에 켠다 (Flyway가 바로 붙으니까)
    stop_grace_period: 40s                 # 끌 때 하던 요청을 마칠 시간 (Spring Boot graceful 30초 + 여유)
    restart: unless-stopped
    # 포트를 열지 않는다: gateway를 통해서만 들어온다

  # AI 비서 - MCP 서버: 예약 코어 API를 MCP 도구로 연다 (mspace-assistant 레포 이미지)
  # 밖으로 열지 않는다. 지금은 X-User-Id 헤더를 그대로 core에 넘기므로(로그인 붙기 전 임시),
  # 밖에서 직접 부르면 남의 이름으로 예약할 수 있다. 안쪽(agent)에서만 부른다
  mcp:
    image: ghcr.io/ai-go-do/mspace-assistant-mcp:${ASSISTANT_TAG:-develop}
    environment:
      CORE_BASE_URL: http://edge:8080      # edge를 지나 core로 (core 교체 중에도 살아 있는 쪽으로)
      # 시간표(my_schedule, 비서 #63·#67)를 Redis에 둔다. memory면 mcp 메모리(재시작하면 사라짐)
      SCHEDULE_STORE: ${SCHEDULE_STORE:-redis}
      # 비밀번호는 .env의 REDIS_PASSWORD (URL에 넣으므로 openssl rand -hex 32처럼 영문·숫자만)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TZ: Asia/Seoul
    depends_on:
      edge:
        condition: service_started
      core:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  # AI 비서 - 에이전트: 사용자 말 → 모델 → MCP 도구. 아직 뼈대(M2에서 기능)라 밖으로 열지 않는다.
  # 텔레그램 봇처럼 에이전트가 먼저 밖으로 나가는 방식이면 들어오는 포트가 필요 없다
  agent:
    image: ghcr.io/ai-go-do/mspace-assistant-agent:${ASSISTANT_TAG:-develop}
    environment:
      MCP_SERVER_URL: http://mcp:8090
      CORE_BASE_URL: http://edge:8080      # edge를 지나 core로
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}  # gemini / ollama
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      # 대화 맥락을 학생별로 24시간 기억 (비서 #60·#61). redis: 아래 redis 컨테이너, memory: agent 메모리(재시작하면 사라짐)
      # Redis가 죽어 있어도 agent는 기억 없이 답한다(경고 로그만). 되돌릴 때는 .env에 MEMORY_STORE=memory
      MEMORY_STORE: ${MEMORY_STORE:-redis}
      # 비밀번호는 .env의 REDIS_PASSWORD (URL에 넣으므로 openssl rand -hex 32처럼 영문·숫자만)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      TZ: Asia/Seoul
    depends_on:
      mcp:
        condition: service_started
      redis:
        condition: service_started
    restart: unless-stopped

  # 비서 저장소 (Redis). 밖으로 포트를 열지 않는다 (agent·mcp만 안쪽에서 부른다)
  #  - 대화 맥락(agent): 24시간 TTL, 잃어도 되는 데이터
  #  - 시간표(mcp): TTL 없음, 재시작해도 남아야 함 → AOF(appendonly) + 볼륨
  # 메모리 정책 volatile-ttl: 64MB가 차면 TTL 있는 키(대화)만 남은 시간이 짧은 것부터 지운다. TTL 없는 시간표는 지우지 않는다
  # (시간표만으로 64MB가 차면 쓰기가 OOM 오류로 거절된다. 학생당 1KB 안쪽이라 수만 명 수준이어야 닿는다)
  redis:
    image: redis:7-alpine
    # 비밀번호(requirepass): 포트는 안 열지만, 같은 네트워크의 다른 컨테이너가 뚫려도 대화·시간표를 바로 못 읽게 한다
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?.env에 REDIS_PASSWORD를 넣어 주세요 (openssl rand -hex 32)}", "--maxmemory", "64mb", "--maxmemory-policy", "volatile-ttl", "--appendonly", "yes", "--appendfsync", "everysec", "--save", ""]
    volumes:
      - redis-data:/data                   # AOF 파일. 컨테이너를 다시 만들어도 시간표 유지
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}     # healthcheck의 redis-cli가 이 값으로 로그인 (명령줄에 비밀번호를 안 남김)
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # 데이터베이스 (밖으로 포트를 열지 않는다)
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:?.env에 DB_NAME을 넣어 주세요}
      POSTGRES_USER: ${DB_USERNAME:?.env에 DB_USERNAME을 넣어 주세요}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?.env에 DB_PASSWORD를 넣어 주세요 (openssl rand -hex 24)}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data   # 컨테이너를 다시 만들어도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
  redis-data:
  climate-data:
