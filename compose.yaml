# 서버(학교 실습 서버)와 노트북에서 M-SPACE 전체를 띄우는 compose.
# 같은 파일을 개발/시연에 같이 쓰고, 값은 .env 파일로만 바꾼다.
#   개발: docker compose -p mspace-dev  --env-file .env.dev  up -d
#   시연: docker compose -p mspace-prod --env-file .env.prod up -d
# (-p 프로젝트 이름이 다르면 컨테이너·DB 볼륨이 따로 생겨서 서로 안 섞인다)

services:
  # 입구: 밖에서 열리는 포트는 이것 하나뿐. /api는 core로, 나머지는 화면(web)으로
  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${PORT}:80"                       # 개발 8411, 시연 8410 (재웅 포트 범위)
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      core:
        condition: service_started
    restart: unless-stopped

  # 예약 코어 (GitHub Actions가 GHCR에 올린 이미지)
  core:
    image: ghcr.io/ai-go-do/mspace-core:${CORE_TAG:-develop}
    environment:
      DB_URL: jdbc:postgresql://db:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILE:-dev}
      TZ: Asia/Seoul
    depends_on:
      db:
        condition: service_healthy         # DB가 준비된 뒤에 켠다 (Flyway가 바로 붙으니까)
    restart: unless-stopped
    # 포트를 열지 않는다: gateway를 통해서만 들어온다

  # 데이터베이스 (밖으로 포트를 열지 않는다)
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      TZ: Asia/Seoul
    volumes:
      - db-data:/var/lib/postgresql/data   # 컨테이너를 다시 만들어도 데이터 유지
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  db-data:
