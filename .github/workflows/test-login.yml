# 개발 서버(dev) 테스트 계정으로 로그인할 수 있게 한다. 팀원이 "두 번째 계정"이 필요할 때 쓴다.
#   테스트 계정은 가짜 학교 메일이라 인증번호 메일을 받을 수 없다. 그래서 번호를 팀원이 직접 정하고, 이 버튼이 그 번호를 DB에 넣는다.
#
# 쓰는 법 (순서가 중요해요)
#   1. 웹(https://dev-mspace.java21.net) 로그인 화면에 테스트 메일을 넣고 "번호 받기"를 누른다
#        99990006 → mspace-test6@chosun.ac.kr (테스트6, 이 버튼이 처음 누를 때 만든다)
#        99990001~99990005 → noshow-test1~5@chosun.ac.kr (테스트1~5)
#   2. Actions 탭 → "테스트 계정 로그인 (dev)" → Run workflow → 계정을 고르고, 아무 6자리 숫자를 정해 넣는다
#   3. 초록 체크가 뜨면(30초쯤) 10분 안에 웹 번호 칸에 그 6자리를 넣는다. 그 사이 "다시 받기"를 누르면 안 된다(새 번호가 이긴다)
#   번호 칸을 비우고 누르면 계정만 만들거나 확인한다.
#
# 안전: dev만 건드린다(시연 prod는 안 건드림). 가짜 메일(noshow-test·mspace-test) 계정에만 번호를 넣고, 진짜 학생 계정에는 넣지 않는다.
# 번호는 로그에 찍지 않고 가린다(::add-mask::). 한 번 쓰면 끝, 10분 지나면 끝, 5번 틀리면 끝이라 이 레포가 공개여도 위험이 작다.
# 비밀값은 앱 배포와 같은 org Secrets(DEPLOY_*)를 쓴다
name: 테스트 계정 로그인 (dev)

on:
  workflow_dispatch:
    inputs:
      account:
        description: '테스트 계정 학번 (99990006 = mspace-test6@chosun.ac.kr)'
        required: true
        default: '99990006'
        type: choice
        options:
          - '99990006'
          - '99990001'
          - '99990002'
          - '99990003'
          - '99990004'
          - '99990005'
      code:
        description: '내가 정한 6자리 숫자 (비우면 계정만 만들기)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: test-login-dev
  cancel-in-progress: false

jobs:
  login:
    # 서버 접속 버튼은 main에 있는 것만 돌린다 (다른 브랜치에서 고친 명령이 서버에 가지 않게)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 입력 확인
        env:
          SID: ${{ inputs.account }}
        run: |
          # 번호는 env·스크립트에 넣지 않고 이벤트 파일에서 읽는다 (env와 스크립트는 로그 머리에 그대로 찍히므로)
          CODE="$(jq -r '.inputs.code // ""' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')"
          if [ -n "$CODE" ]; then echo "::add-mask::$CODE"; fi
          # 숫자만 받는다. 이 모양이면 SQL·셸에 그대로 넣어도 안전하다
          [[ "$SID" =~ ^9999000[1-6]$ ]] || { echo "테스트 계정 학번이 아니에요"; exit 1; }
          [[ -z "$CODE" || "$CODE" =~ ^[0-9]{6}$ ]] || { echo "번호는 숫자 6자리로 넣어 주세요"; exit 1; }

      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] && [ -n "$HOST" ] && [ -n "$PORT" ] && [ -n "$SSH_USER" ] || { echo "DEPLOY_* Secrets를 이 레포에서 볼 수 없음: org Secrets 설정에서 infra 레포를 허용 목록에 넣어 주세요"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts   # 처음 보는 서버면 접속을 거부한다 (가짜 서버 방지)

      - name: dev DB에 계정·번호 넣기
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SID: ${{ inputs.account }}
        run: |
          CODE="$(jq -r '.inputs.code // ""' "$GITHUB_EVENT_PATH" | tr -d '[:space:]')"
          [[ -z "$CODE" || "$CODE" =~ ^[0-9]{6}$ ]] || exit 1
          # 번호는 명령줄(서버 프로세스 목록)에 안 남게 표준 입력으로만 넘긴다. 위에서 숫자만 통과시켰다
          { printf 'SID=%s\nCODE=%s\n' "$SID" "$CODE"; cat <<'REMOTE'
          set -euo pipefail
          cd ~/infra
          [ -f .env.dev ] || { echo ".env.dev 파일이 없음"; exit 1; }
          psql_dev() {
            docker compose -p mspace-dev --env-file .env.dev exec -T db \
              sh -c 'psql -v ON_ERROR_STOP=1 -qtA -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          }
          # 테스트6이 없으면 만든다. 학번·메일이 이미 있으면 그대로 둔다
          psql_dev <<SQL >/dev/null
          INSERT INTO users (email, student_id, name, verified_at)
          VALUES ('mspace-test6@chosun.ac.kr', '99990006', '테스트6', now())
          ON CONFLICT DO NOTHING;
          SQL
          # 가짜 메일 계정만 고른다 (진짜 학생 계정에는 번호를 넣지 않는다)
          email=$(psql_dev <<SQL
          SELECT email FROM users
           WHERE student_id = '$SID'
             AND email ~ '^(noshow|mspace)-test[0-9]+@chosun\.ac\.kr$';
          SQL
          )
          [ -n "$email" ] || { echo "학번 $SID 테스트 계정을 찾지 못했어요 (가짜 메일 계정이 아님)"; exit 1; }
          if [ -z "$CODE" ]; then
            echo "계정 준비됨: 학번 $SID · 메일 $email"
            exit 0
          fi
          # core와 같은 방식: sha256(메일 + ":" + 번호). 가장 최근 줄이 쓰이므로 웹에서 "번호 받기"를 먼저 누른 뒤 넣어야 한다
          psql_dev <<SQL >/dev/null
          INSERT INTO email_verification (email, code_hash, created_at, expires_at)
          VALUES ('$email', encode(sha256(convert_to('$email' || ':' || '$CODE', 'UTF8')), 'hex'),
                  now(), now() + interval '10 minutes');
          SQL
          echo "번호를 넣었어요: 학번 $SID · 메일 $email. 10분 안에 웹 번호 칸에 정한 6자리를 넣으세요"
          REMOTE
          } | ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes "$SSH_USER@$HOST" bash -s
