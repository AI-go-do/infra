# 개발 서버(dev)에서 "가상 학생"을 켜고 끈다. 영상·시연 때 학생 앱의 방 목록·빈 시간·방 현황이 실제 예약으로 움직이게 한다.
#   켜면: 가상 학생 60명(학번 99980001~99980060, sim-student01~60@chosun.ac.kr, 이름 가상학생01~60)을 만들고 서로 친구로 맺는다.
#         그 목록을 .env.dev의 CLIMATE_SIM_STUDENTS에 넣고 climate를 다시 띄운다. 그 뒤로는 climate가 2~5번 방에
#         가상 학생의 예약·QR 입실·퇴실을 core 공개 API로 만든다(mspace-climate README "가상 학생"). 1번 방은 안 건드린다.
#   끄면: CLIMATE_SIM_STUDENTS를 비우고 climate를 멈춘 뒤, 가상 학생의 시작 전 예약을 취소하고(노쇼가 쌓이지 않게) climate를 다시 띄운다.
#         계정·지난 기록은 남긴다(다시 켜면 그대로 씀).
#
# 쓰는 법: Actions 탭 → "가상 학생 (dev)" → Run workflow → 켜기/끄기 고르기. 1분쯤 걸린다
#
# 안전: dev만 건드린다(시연 prod는 안 건드림). 가짜 메일(sim-student) 계정만 만들고 고친다. 진짜 학생 계정·예약은 건드리지 않는다.
# 가짜 메일이라 로그인할 수 없고, core는 알림을 메일로 보내지 않아(알림함만) 메일이 나가지 않는다.
# 로그에는 사람 수만 찍는다. 비밀값은 앱 배포와 같은 org Secrets(DEPLOY_*)를 쓴다
name: 가상 학생 (dev)

on:
  workflow_dispatch:
    inputs:
      action:
        description: '켜기(start) / 끄기(stop)'
        required: true
        default: start
        type: choice
        options:
          - start
          - stop

permissions:
  contents: read

concurrency:
  group: sim-students-dev
  cancel-in-progress: false

jobs:
  sim:
    # 서버 접속 버튼은 main에 있는 것만 돌린다 (다른 브랜치에서 고친 명령이 서버에 가지 않게)
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH 키 준비
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          [ -n "$SSH_KEY" ] && [ -n "$KNOWN_HOSTS" ] && [ -n "$HOST" ] && [ -n "$PORT" ] && [ -n "$SSH_USER" ] || { echo "DEPLOY_* Secrets를 이 레포에서 볼 수 없음: org Secrets 설정에서 infra 레포를 허용 목록에 넣어 주세요"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy && chmod 600 ~/.ssh/id_deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts   # 처음 보는 서버면 접속을 거부한다 (가짜 서버 방지)

      - name: dev에서 가상 학생 켜기·끄기
        env:
          HOST: ${{ secrets.DEPLOY_HOST }}
          PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          ACTION: ${{ inputs.action }}
        run: |
          case "$ACTION" in start|stop) ;; *) echo "start 또는 stop만"; exit 1 ;; esac
          ssh -i ~/.ssh/id_deploy -p "$PORT" -o BatchMode=yes "$SSH_USER@$HOST" bash -s -- "$ACTION" <<'REMOTE'
          set -euo pipefail
          ACTION="$1"
          # 앱 배포(deploy.yml)와 같은 잠금: 배포와 동시에 compose를 건드리지 않게
          exec 9>"$HOME/.mspace-deploy.lock"
          flock -w 300 9 || { echo "다른 배포가 5분 넘게 끝나지 않음"; exit 1; }
          cd ~/infra
          [ -f .env.dev ] || { echo ".env.dev 파일이 없음"; exit 1; }
          STATUS=$(git status --porcelain) || { echo "git status 실패"; exit 1; }
          [ -z "$STATUS" ] || { echo "~/infra에 커밋 안 된 수정·새 파일이 있음: 멈춤"; git status --short; exit 1; }
          [ "$(git rev-parse --abbrev-ref HEAD)" = main ] || { echo "~/infra가 main 브랜치가 아님: 멈춤"; exit 1; }
          C="docker compose -p mspace-dev --env-file .env.dev"
          check() { for E in dev prod; do [ -f ".env.$E" ] || continue; docker compose -p "mspace-$E" --env-file ".env.$E" config -q || return 1; done; }
          OLD=$(git rev-parse HEAD)
          git pull --ff-only                       # compose가 CLIMATE_SIM_STUDENTS를 climate에 넘기는 판이어야 한다
          check || { echo "compose 설정 오류: infra를 받기 전 커밋으로 되돌림"; git reset -q --hard "$OLD"; exit 1; }
          grep -q 'CLIMATE_SIM_STUDENTS' compose.yaml || { echo "compose.yaml이 CLIMATE_SIM_STUDENTS를 넘기지 않음"; exit 1; }
          psql_dev() {
            $C exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -qtA -U "$POSTGRES_USER" -d "$POSTGRES_DB"'
          }
          # .env.dev의 CLIMATE_SIM_STUDENTS 한 줄만 바꾼다(다른 줄·권한은 그대로). 값은 숫자·쌍점·쉼표뿐이라 그대로 넣어도 안전하다
          set_env() {
            cp -p .env.dev .env.dev.sim-tmp
            { grep -v '^CLIMATE_SIM_STUDENTS=' .env.dev || true; printf 'CLIMATE_SIM_STUDENTS=%s\n' "$1"; } > .env.dev.sim-tmp
            mv .env.dev.sim-tmp .env.dev
          }
          SIM="email ~ '^sim-student[0-9]+@chosun\.ac\.kr\$' AND student_id ~ '^9998[0-9]{4}\$'"

          if [ "$ACTION" = start ]; then
            # 가상 학생 60명. 이미 있으면 그대로 둔다
            psql_dev <<SQL >/dev/null
          INSERT INTO users (email, student_id, name, verified_at)
          SELECT 'sim-student' || lpad(n::text, 2, '0') || '@chosun.ac.kr', '9998' || lpad(n::text, 4, '0'),
                 '가상학생' || lpad(n::text, 2, '0'), now()
            FROM generate_series(1, 60) AS n
          ON CONFLICT DO NOTHING;
          -- 가상 학생끼리만 친구(참여자는 서로 친구여야 함). 실제 학생과는 맺지 않는다
          INSERT INTO friendship (requester_id, addressee_id, status, requested_at, accepted_at)
          SELECT a.id, b.id, 'ACCEPTED', now(), now()
            FROM (SELECT id FROM users WHERE $SIM) a
            JOIN (SELECT id FROM users WHERE $SIM) b ON a.id < b.id
          ON CONFLICT DO NOTHING;
          SQL
            LIST=$(psql_dev <<SQL
          SELECT string_agg(id || ':' || student_id, ',' ORDER BY id) FROM users WHERE $SIM;
          SQL
            )
            [[ "$LIST" =~ ^[0-9]+:[0-9]+(,[0-9]+:[0-9]+)*$ ]] || { echo "가상 학생 목록을 만들지 못했어요"; exit 1; }
            N=$(tr ',' '\n' <<<"$LIST" | wc -l)
            set_env "$LIST"
            echo "가상 학생 $N명 준비됨"
          else
            set_env ""
            $C stop climate </dev/null   # 취소 전에 옛 climate를 멈춰 그 사이 새 예약이 생기지 않게 한다
            # 시작 전 예약만 취소(BOOKED → CANCELED는 core가 허용하는 길). 쓰는 중인 예약은 끝 시각에 core가 자동 퇴실시킨다
            # 취소가 실패해도 climate는 꼭 다시 띄운다(멈춘 채 남지 않게). 실패는 맨 끝에 알린다
            if CANCELED=$(psql_dev <<SQL
          WITH c AS (
            UPDATE reservation r SET status = 'CANCELED', canceled_at = now()
             WHERE r.owner_id IN (SELECT id FROM users WHERE $SIM) AND r.status = 'BOOKED' AND r.start_at > now()
            RETURNING r.id)
          SELECT count(*) FROM c;
          SQL
            ); then
              echo "가상 학생 끔: 시작 전 예약 ${CANCELED:-0}건 취소"
            else
              echo "예약 취소 실패: climate를 다시 띄운 뒤 실패로 끝내요"
              CANCEL_FAILED=1
            fi
          fi

          check || { echo "compose 설정 오류(.env.dev)"; exit 1; }
          $C pull -q climate </dev/null || true      # 새 이미지가 있으면 받는다(실패해도 지금 이미지로)
          $C up -d --force-recreate climate </dev/null   # 값이 그대로여도 새로 띄워 아래 로그 확인이 되게
          for i in $(seq 1 30); do
            if $C logs --since 2m climate 2>/dev/null </dev/null | grep -q 'Started ClimateApplication'; then
              if [ "$ACTION" = start ]; then
                $C logs --since 2m climate 2>/dev/null </dev/null | grep -q '가상 학생 켬' \
                  && { echo "climate가 가상 학생을 켰어요"; exit 0; }
                echo "climate는 떴지만 가상 학생이 안 켜졌어요 (climate 이미지가 옛 판일 수 있음: mspace-climate develop 배포 뒤 다시 누르기)"; exit 1
              fi
              echo "climate 다시 뜸"; exit "${CANCEL_FAILED:-0}"
            fi
            sleep 3
          done
          echo "climate가 90초 안에 뜨지 않았어요"; exit 1
          REMOTE
