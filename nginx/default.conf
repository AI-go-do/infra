# 우리 입구 nginx. 학교 nginx가 도메인으로 받은 요청을 우리 포트(개발 8411 / 시연 8412)로 넘기면 여기서 나눈다.
server {
    listen 80;

    # 컨테이너 주소를 nginx가 켤 때 한 번만 찾으면, core·web을 새 이미지로 바꿨을 때(배포)
    # 옛 IP로 계속 보내서 502가 나거나 엉뚱한 컨테이너로 간다. 그래서 Docker 내부 DNS(127.0.0.11)에
    # 10초마다 다시 묻는다. proxy_pass에 변수를 써야 nginx가 요청 때마다 이름을 찾는다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $core http://core:8080;
    set $web  http://web:80;

    # API는 core로
    location /api/ {
        proxy_pass $core;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 배포 직후 살아 있는지 확인용
    location = /actuator/health {
        proxy_pass $core;
    }

    # 나머지는 전부 화면(mspace-web). 화면 주소(/me 등) 처리와 캐시는 web 컨테이너의 nginx가 한다
    location / {
        proxy_pass $web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
