# 우리 입구 nginx. 학교 nginx가 도메인으로 받은 요청을 우리 포트(8410/8411)로 넘기면 여기서 나눈다.
server {
    listen 80;

    # API는 core로
    location /api/ {
        proxy_pass http://core:8080;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 배포 직후 살아 있는지 확인용
    location = /actuator/health {
        proxy_pass http://core:8080;
    }

    # 화면(mspace-web)은 아직 없어서 임시 안내. web 이미지가 생기면 proxy_pass http://web:80; 으로 바꾼다
    location / {
        default_type text/plain;
        return 200 "M-SPACE: web 준비 중 (API는 /api, 상태는 /actuator/health)\n";
    }
}
