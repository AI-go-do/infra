# 입구(edge) nginx: 무중단 배포용 고정 문 (infra/README.md "무중단 배포")
#
# 왜 있나: 서버 포트(8413·8414)는 컨테이너 하나만 잡을 수 있다. 예전엔 gateway가 직접 잡아서
# gateway를 바꾸는 동안 몇 초~수십 초 끊겼다. 이제 이 edge가 포트를 계속 잡고 있고,
# 뒤의 gateway·core·web은 scripts/rollout.sh가 "새 것 하나 더 띄우기 → 확인 → 옛 것 끄기"로 바꾼다.
# 그동안 edge는 Docker 내부 DNS(127.0.0.11)를 2초마다 다시 물어 새 컨테이너를 찾고,
# 꺼지는 컨테이너에 연결이 안 되면 다른 컨테이너로 다시 보낸다(proxy_next_upstream).
#
# 이 파일만 바꿨을 때는 edge를 다시 만들지 않고 설정만 다시 읽는다(rollout.sh가 nginx -s reload).
# 그래서 edge 자신도 끊기지 않는다. 폴더째 연결해서 git pull로 파일이 바뀌어도 컨테이너가 새 파일을 본다.

resolver 127.0.0.11 valid=2s ipv6=off;
resolver_timeout 2s;

# 뒤 서비스 묶음. resolve: 이름을 계속 다시 찾아서 컨테이너가 늘고 줄어도 따라간다 (nginx 1.27.3+)
# max_fails=1 fail_timeout=2s: 한 번 연결이 안 되면 2초 동안 그 컨테이너는 빼고 보낸다 (막 켜지는 중인 새 컨테이너도 잠깐 여기 걸린다)
upstream gateway_pool {
    zone gateway_pool 64k;
    server gateway:8000 resolve max_fails=1 fail_timeout=2s;
}
upstream core_pool {
    zone core_pool 64k;
    server core:8080 resolve max_fails=1 fail_timeout=2s;
}
upstream web_pool {
    zone web_pool 64k;
    server web:80 resolve max_fails=1 fail_timeout=2s;
}

# 공통: 받은 요청을 최대한 그대로 넘긴다 (Host·X-Forwarded-* 를 바꾸지 않는다)
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header Connection "";
# 연결이 안 되면(꺼지는 중인 컨테이너) 다른 컨테이너로. POST 같은 요청은 "아직 안 보냈을 때"만 다시 보낸다(nginx 기본)
proxy_next_upstream error timeout;
proxy_next_upstream_tries 5;          # 꺼진 컨테이너 주소가 DNS 기억(2초)에 남아 있을 수 있어서 넉넉히
proxy_next_upstream_timeout 10s;
proxy_connect_timeout 1s;           # 같은 서버 안이라 연결은 바로 된다. 안 되면 빨리 다음 컨테이너로
proxy_read_timeout 120s;            # 비서(agent)는 모델 응답을 기다려 90초까지 걸릴 수 있다 (gateway response-timeout 90s)
proxy_send_timeout 120s;
proxy_buffering off;                # 응답을 쌓아 두지 않고 바로 흘려보낸다
client_max_body_size 20m;           # 크기 제한은 gateway·core가 한다. 여기서 먼저 막지 않게 넉넉히
access_log off;                     # 요청 기록은 학교 nginx와 gateway에 있다. 여기서 또 남기지 않는다

# 밖(학교 nginx) → gateway. 서버 포트(.env의 PORT)가 이 8000으로 들어온다
server {
    listen 8000;
    location / { proxy_pass http://gateway_pool; }
}

# 안쪽: gateway·mcp·agent → core (compose의 CORE_URI·CORE_BASE_URL이 edge:8080)
server {
    listen 8080;
    location / { proxy_pass http://core_pool; }
}

# 안쪽: gateway → 화면(web) (compose의 WEB_URI가 edge:8081)
server {
    listen 8081;
    location / { proxy_pass http://web_pool; }
}

# edge 자신이 살아 있는지 (rollout.sh가 확인용으로 쓴다. 밖으로 안 연다)
server {
    listen 8099;
    location = /edge-health { return 200 "ok\n"; }
}
